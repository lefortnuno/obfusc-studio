<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<meta content="width=device-width, initial-scale=1" name="viewport"/>
	<title>ConvertEasy</title>
	<link
			href="/assets/images/logos/AC2I.svg"
			rel="shortcut icon"
			type="image/png"
	/>
	<link href="/assets/css/styles.min.css" rel="stylesheet"/>
</head>

<body>
<!--  Body Wrapper -->
<div
		class="page-wrapper"
		data-header-position="fixed"
		data-layout="vertical"
		data-navbarbg="skin6"
		data-sidebar-position="fixed"
		data-sidebartype="full"
		id="main-wrapper"
>
	<div
			class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center"
	>
		<div class="d-flex align-items-center justify-content-center w-100">
			<div class="row justify-content-center w-100">
				<div class="col-md-8 col-lg-6 col-xxl-3">
					<div class="card mb-0">
						<div class="card-body">
							<a
									class="text-nowrap logo-img text-center d-block py-3 w-100 fs-8 fw-bolder mb-4"
									href="/"
							> ConvertEasy
								<!--<img
										alt=""
										src="/assets/images/logos/dark-logo.svg"
										width="180"
								/>-->
							</a>
							<!-- <p class="text-center">Your Social Campaigns</p> -->
							<form autocomplete="off" method="post" name="f" th:action="@{/login}">
								<div class="mb-3">
									<label class="form-label" for="username">
										Nom d'utilisateur
									</label>
									<input
											class="form-control"
											id="username"
											name="username"
											type="text"
									/>
								</div>
								<div class="mb-4">
									<label class="form-label" for="password">
										Mot de passe
									</label>
									<input
											class="form-control"
											id="password"
											name="password"
											type="password"
									/>
								</div>
<!--								<div class="d-flex align-items-center justify-content-between mb-4" >-->
<!--									<div class="form-check">-->
<!--										<input-->
<!--												checked-->
<!--												class="form-check-input primary"-->
<!--												id="flexCheckChecked"-->
<!--												name="remember-me"-->
<!--												type="checkbox"-->
<!--												value=""-->
<!--										/>-->
<!--										<label-->
<!--												class="form-check-label text-dark"-->
<!--												for="flexCheckChecked"-->
<!--										>-->
<!--											Remeber this Device-->
<!--										</label>-->
<!--									</div>-->
<!--									&lt;!&ndash;<a class="text-primary fw-bold" href="./index.html"-->
<!--									>Forgot Password ?</a-->
<!--									>&ndash;&gt;-->
<!--								</div>-->
								<button
										class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2"
										id="loginBtn"
										type="submit"
								>
									Se connecter
								</button>

                                <!-- MESSAGE D'ERREUR LOGIN -->
								<br/>
								<div class="alert alert-danger" id="alert" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">
									Nom d'utilisateur ou mot de passe incorrect.
								</div>

							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelector('form').addEventListener('submit', function() {
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Connexion...';
    });
</script>
</body>
</html>
