<!DOCTYPE html>
<html
  th:fragment="layout (pageTitle, content)"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title th:text="${pageTitle}">Default Title</title> 
    <link
        href="/assets/images/logos/AC2I.svg"
        rel="shortcut icon"
        type="image/png"
    />
    <link href="/assets/css/styles.min.css" rel="stylesheet" />
  </head>

  <body>
    <!--  Body Wrapper -->
    <div
      class="page-wrapper"
      data-header-position="fixed"
      data-layout="vertical"
      data-navbarbg="skin6"
      data-sidebar-position="fixed"
      data-sidebartype="full"
      id="main-wrapper"
    >
      <!-- Sidebar Start -->
      <aside class="left-sidebar">
        <!-- Sidebar scroll-->
        <div>
          <div
            class="brand-logo d-flex align-items-center justify-content-between"
          >
            <a
              class="text-nowrap logo-img text-center d-block py-3 w-100 fs-8 fw-bolder"
              href="/"
            >
              ConvertEasy
            </a>
            <div
              class="close-btn d-xl-none d-block sidebartoggler cursor-pointer"
              id="sidebarCollapse"
            >
              <i class="ti ti-x fs-8"></i>
            </div>
          </div>
          <!-- Sidebar navigation-->
          <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
            <ul id="sidebarnav">
              <li class="sidebar-item">
                <a aria-expanded="false" class="sidebar-link" th:href="@{/}">
                  <span>
                    <i class="ti ti-layout-dashboard"></i>
                  </span>
                  <span class="hide-menu">Accueil</span>
                </a>
              </li>
              <li
                class="nav-small-cap"
                style="
                  color: #2a3547;
                  display: -webkit-box;
                  display: -ms-flexbox;
                  display: flex;
                  font-size: 14px;
                  white-space: nowrap;
                  -webkit-box-align: center;
                  -ms-flex-align: center;
                  align-items: center;
                  line-height: 25px;
                  position: relative;
                  margin: 0px 0px 2px;
                  padding: 10px;
                  border-radius: 7px;
                  gap: 15px;
                  font-weight: 400;
                  text-transform: none;
                "
              >
                <span class="sidebar-link">
                  <span>
                    <i class="ti ti-article fs-4"></i>
                  </span>
                  <span class="hide-menu">Gestion des formats</span>
                </span>
              </li>
              <li class="sidebar-item">
                <a
                  aria-expanded="false"
                  class="sidebar-link"
                  th:href="@{/structurs}"
                >
                  <i class="ti ti-article opacity-0"></i>
                  <span class="hide-menu">Format à mono structure</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a
                  aria-expanded="false"
                  class="sidebar-link"
                  th:href="@{/complex-structures/main}"
                >
                  <span>
                    <i class="ti ti-article opacity-0"></i>
                  </span>
                  <span class="hide-menu">Format à multi structures</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a
                  aria-expanded="false"
                  class="sidebar-link"
                  th:href="@{/complex-structures/sub}"
                >
                  <span>
                    <i class="ti ti-article opacity-0"></i>
                  </span>
                  <span class="hide-menu">structures</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a
                  aria-expanded="false"
                  class="sidebar-link"
                  th:href="@{/users}"
                >
                  <span>
                    <i class="ti ti-user-plus"></i>
                  </span>
                  <span class="hide-menu">Gestion des utilisateurs</span>
                </a>
              </li>
            </ul>
          </nav>
          <!-- End Sidebar navigation -->
        </div>
        <!-- End Sidebar scroll-->
      </aside>
      <!--  Sidebar End -->
      <!--  Main wrapper -->
      <div class="body-wrapper">
        <!--  Header Start -->
        <header class="app-header">
          <nav class="navbar navbar-expand-lg navbar-light">
            <ul class="navbar-nav">
              <li class="nav-item d-block d-xl-none">
                <a
                  class="nav-link sidebartoggler nav-icon-hover"
                  href="javascript:void(0)"
                  id="headerCollapse"
                >
                  <i class="ti ti-menu-2"></i>
                </a>
              </li>
            </ul>
            <div
              class="navbar-collapse justify-content-end px-0"
              id="navbarNav"
            >
              <ul
                class="navbar-nav flex-row ms-auto align-items-center justify-content-end"
              >
                <li class="nav-item dropdown">
                  <a
                    aria-expanded="false"
                    class="nav-link"
                    data-bs-toggle="dropdown"
                    href="javascript:void(0)"
                    id="drop2"
                  >
                    <div class="">
                      <span
                        class="mb-0 mx-2 fs-3 text-capitalize"
                        th:text="${currentappuser.firstname +' '+ currentappuser.lastname}"
                        >My Profile</span
                      >
                      <img
                        alt=""
                        class="rounded-circle"
                        height="35"
                        src="/assets/images/profile/user-2.jpg"
                        width="35"
                      />
                    </div>
                  </a>
                  <div
                    aria-labelledby="drop2"
                    class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                  >
                    <div class="message-body">
                      <a
                        th:href="@{/users/edit(id=${currentappuser.userID})}"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-user fs-6"></i>
                        <p class="mb-0 fs-3">Mon profil</p>
                      </a>
                      <form
                        autocomplete="off"
                        class="d-grid"
                        method="post"
                        th:action="@{/logout}"
                      >
                        <button
                          class="btn btn-outline-primary mx-3 mt-2 d-block"
                          type="submit"
                        >
                          Déconnexion
                        </button>
                      </form>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </header>
        <!--  Header End -->
        <div class="container-fluid">
          <div class="card">
            <div class="card-body" th:replace="${content}">
              <h5 class="card-title fw-semibold mb-4">Sample Page</h5>
              <p class="mb-0">This is a sample page</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebarmenu.js"></script>
    <script src="/assets/js/app.min.js"></script>
    <script src="/assets/js/custom.js"></script>
    <script src="/assets/libs/simplebar/dist/simplebar.js"></script>
  </body>
</html>
