<!DOCTYPE html>
<html
		th:insert="~{layout/master-layout :: layout(${pageTitle}, ~{::section})}"
		xmlns:th="http://www.thymeleaf.org"
>
<head></head>
<body>
<section class="card-body" th:fragment="content">
	<h3 class="mb-4">Editer format à multi structures</h3>
	<form autocomplete="off" id="com-structure-form" data-url="/complex-structures/main/update/">
		<input th:name="${_csrf.parameterName}"
			   th:value="${_csrf.token}"
			   type="hidden"/>
		<input id="struck-id" th:value="${complexStructure.id}" type="hidden"/>
		<div class="row">
			<div class="mb-3 col-4">
				<label class="form-label" for="struc-name">Nom format</label>
				<input
						class="form-control"
						id="struc-name"
						onchange="checkempty('#struc-name')"
						type="text"
						th:value="${complexStructure.name}"
				/>
				<div
						class="form-text text-danger"
						id="struc-name-help"
						style="display: none"
				>
					We'll never share your email with anyone else.
				</div>
			</div>

			<div class="mb-3 col-4">
				<label class="form-label" for="lib-struc">Libelle</label>
				<input
						class="form-control"
						id="lib-struc"
						onchange="checkempty('#lib-struc')"
						type="text"
						th:value="${complexStructure.libelle}"
				/>
				<div
						class="form-text text-danger"
						id="lib-struc-help"
						style="display: none"
				>
					We'll never share your email with anyone else.
				</div>
			</div>
			<div class="mb-3 col-4">
				<!--<label class="form-label" for="struc-type">L'alignement</label>
				<select class="form-select" id="struc-type" name="typestruc">
					<option disabled selected value="">sélectionner l'alignement</option>
					<option value="horizontal">horizontal</option>
					<option value="vertical">vertical</option>
				</select>
				<div class="form-text text-danger"
					 id="struc-type-help"
					 style="display: none"
				>
					We'll never share your email with anyone else.
				</div>-->
			</div>
		</div>
		<div class="card">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table text-nowrap mb-0 align-middle">
						<thead class="text-white fs-4">
						<tr>
							<th class="border-bottom-2">
								<h6 class="fw-semibold mb-0">choix des structures</h6>
							</th>
							<th class="border-bottom-2">
								<h6 class="fw-semibold mb-0"></h6>
							</th>
						</tr>
						</thead>
						<tbody id="field_tab">
						<tr class="field-row" th:each="com_sub_struc : ${complexsubStructures}">
							<td class="border-bottom-1">
								<select class="form-select typefields" name="typefields" id="type01" onchange="UpdateSUBListItems(this)">
									<option disabled  value="">choisir une sous-structure</option>
									<option th:each="sub_struc : ${subStructures}" th:selected="${com_sub_struc.id == sub_struc.id}" th:value="${sub_struc.id}" th:text="${sub_struc.name}"></option>
								</select>
								<span class="text-danger fw-bolder fs-1 input-error" style="display: none"></span>
							</td>
							<td class="border-bottom-1">
								<a onclick="removeItem(this)" class="btn btn-link m-1"><i class="ti ti-trash"></i></a>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="alert alert-danger" id="alert" role="alert" style="display: none;">
			
		</div>
		<div
				class="d-flex justify-content-between align-content-center m-2 mt-3"
		>
			<button class="btn btn-primary" id="add_com_btn">ajouter une structure</button>
			<button class="btn btn-primary" id="gene_com_xml_btn">générer la structure xml</button>


		</div>
		<div class="card">
			<div class="card-body">
				<textarea class="form-control" cols="30" id="big-expression" name="" rows="10" th:text="${complexStructure.expression}"></textarea>
				<span class="text-danger fw-bolder fs-1 input-error" style="display: none"></span>
			</div>
		</div>

		<div class="d-flex justify-content-between align-content-center m-2 mt-3">
			<span></span>

			<button class="btn btn-primary" id="btnsubmit">Soumettre</button>
		</div>
	</form>
</section>
</body>
</html>
