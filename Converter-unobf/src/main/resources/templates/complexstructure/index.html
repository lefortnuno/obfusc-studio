<!DOCTYPE html>
<html
		th:insert="~{layout/master-layout :: layout(${pageTitle}, ~{::section})}"
		xmlns:th="http://www.thymeleaf.org"
>
<head>
	<!--    <title th:fragment="title" th:text="${pageTitle}">Home Page</title>-->
</head>
<body>
<section class="card-body p-4" th:fragment="content">
	<div class="d-flex w-100 justify-content-between ">
		<h5 class="card-title fw-bolder text-primary" th:text="${pageTitle}">Recent Transactions</h5>
		<form autocomplete="off" class="d-flex gap-1 mb-2" method="get" th:action="@{/complex-structures/main}">
			<input class="form-control" name="keyword" th:value="${keyword}" type="text">
			<button class="btn btn-info" type="submit">
				<i class="ti ti-search"></i>
			</button>
			<a class="btn btn-primary" th:href="@{/complex-structures/main/create}" type="submit">
				<i class="ti ti-plus"></i>
			</a>

		</form>
	</div>
	<div class="table-responsive">
		<table class="table text-nowrap mb-0 align-middle">
			<thead class="text-dark fs-4">
			<tr>
				<th class="border-bottom-2">
					<h6 class="fw-semibold mb-0">Nom</h6>
				</th>
				<th class="border-bottom-2">
					<h6 class="fw-semibold mb-0">Libellé</h6>
				</th>
				<!--<th class="border-bottom-2">
					<h6 class="fw-semibold mb-0">Type</h6>
				</th>-->
				<th class="border-bottom-2">
					<h6 class="fw-semibold mb-0">Date de création</h6>
				</th>
				<th class="border-bottom-2">
				</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="s:${listStructures}">
				<td class="border-bottom-1">
					<h6 class="fw-semibold mb-0" th:text="${s.name}">1</h6>
				</td>
				<td class="border-bottom-1">
					<h6 class="fw-normal mb-0" th:text="${s.libelle}">Sunil Joshi</h6>
				</td>
				<!--<td class="border-bottom-1">
					<p class="mb-0 fw-normal" th:text="${s.StrType}">Elite Admin</p>
				</td>-->
				<td class="border-bottom-1">
					<p class="mb-0 fw-normal" th:text="${#dates.format(s.createdAt, 'dd/MM/yyyy')}">
						Elite Admin</p>
				</td>
				<td class="border-bottom-1">
					<a class="btn btn-link m-1" th:href="@{/complex-structures/main/edit(id=${s.id})}"><i class="ti ti-edit"></i></a>
					<a class="btn btn-link m-1" data-bs-toggle="modal" th:data-bs-target="${'#exampleModal'+s.id}"><i class="ti ti-trash"></i></a>
					<div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" tabindex="-1" th:id="${'exampleModal'+s.id}">
						<div class="modal-dialog">
							<div class="modal-content">
								<div class="modal-header">
									<h1 class="modal-title fs-5" id="exampleModalLabel">Supprimer structure complexe</h1>
									<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
								</div>
								<div class="modal-body">
									Veuillez vraiment supprimer Format à multi structure ?
								</div>
								<div class="modal-footer">
									<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">annuler
									</button>
									<a class="btn btn-danger" th:href="@{/complex-structures/main/delete(id=${s.id}, keyword=${keyword}, page=${currentPage})}">supprimer</a>
								</div>
							</div>
						</div>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
	<nav class="mt-3" aria-label="Pagination" th:if="${totalPages > 0}">
		<ul class="pagination justify-content-center">
			<li>
				<a aria-label="First Page" class="btn ms-1 "
				   th:classappend="${currentPage == 0} ? 'disabled':'btn-outline-info'"
				   th:href="@{/complex-structures/sub(page=1,keyword=${keyword})}">
					<i class="ti ti-chevrons-left"></i>
				</a>
			</li>
			<li>
				<a aria-label="Previous Page"
				   class="btn ms-1 font-weight-bold"
				   th:classappend="${currentPage == 0} ? 'disabled':'btn-outline-info'"
				   th:href="@{/complex-structures/sub(page=${currentPage - 1},keyword=${keyword})}">Précédent</a>
			</li>
			<li class="btn ms-1 disabled" th:if="${currentPage - 2 > 1}">
				<span class="page-link">...</span>
			</li>
			<li th:each="page : ${#numbers.sequence(currentPage > 2 ? currentPage - 2 : 1, currentPage + 2 < totalPages ? currentPage + 2 : totalPages)}">
				<a aria-label="Page [[${page}]]"
				   class="btn ms-1"
				   th:classappend="${page == currentPage+1} ? 'btn-info':'btn-outline-info'" th:href="@{/complex-structures/sub(page=${page-1},keyword=${keyword})}"
				   th:text="${page}"></a>
			</li>
			<li class="btn ms-1 disabled" th:if="${currentPage + 2 < totalPages}">
				<span class="page-link">...</span>
			</li>
			<li>
				<a aria-label="Suivant Page"
				   class="btn ms-1 font-weight-bold"
				   th:classappend="${currentPage == totalPages-1} ? 'disabled':'btn-outline-info'" th:href="@{/complex-structures/sub(page=${currentPage + 1},keyword=${keyword})}">Suivant</a>
			</li>
			<li>
				<a aria-label="Last Page"
				   class="btn ms-1 "
				   th:classappend="${currentPage == totalPages-1} ? 'disabled':'btn-outline-info'"
				   th:href="@{/complex-structures/sub(page=${totalPages},keyword=${keyword})}">
					<i class="ti ti-chevrons-right"></i>
				</a>
			</li>
		</ul>
	</nav>
</section>
</body>
</html>
